[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "file .toml for the RAG project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "bm25s>=0.3.9",
    "fire>=0.7.1",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
    "pydocstyle>=6.3.0",
    "rank-bm25>=0.2.2",
    "torch>=2.13.0",
    "tqdm>=4.68.1",
    "transformers>=5.10.2",
    "types-tqdm>=4.69.0.20260720",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
